<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tropiciel">
<meta name="theme-color" content="#1a3d2a">
<title>Tropiciel Zwierząt</title>
<style>
  :root{
    --tlo1:#1d3a2a; --tlo2:#0d1f16;
    --akcent:#ffd166; --akcent2:#8ee06a; --brzeg:rgba(255,255,255,.18);
    --panel:rgba(10,26,18,.88);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(120% 90% at 50% 0%, #2f6b45 0%, #1a3d2a 45%, #0a1a12 100%);
    background-attachment:fixed;
    color:#eefaf0;
    font-family:"Segoe UI Rounded","Segoe UI",Nunito,system-ui,-apple-system,sans-serif;
    display:flex;align-items:flex-start;justify-content:center;
    overflow-x:hidden;overflow-y:auto;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #app{width:min(100vw,1120px);padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .screen{display:none;width:100%;animation:fade .25s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  h1{
    margin:0 0 2px;text-align:center;font-size:clamp(26px,5vw,44px);letter-spacing:1px;
    background:linear-gradient(180deg,#ffffff,#a8e9b4);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 6px 24px rgba(0,0,0,.35);
  }
  .podtytul{text-align:center;opacity:.75;margin:0 0 16px;font-size:15px}

  /* ---------- wybor krainy ---------- */
  .krainy{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .kraina{
    position:relative;border-radius:20px;padding:16px;border:2px solid var(--brzeg);cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    transition:.15s transform,.15s border-color;min-height:150px;
    display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  }
  .kraina:hover{transform:translateY(-4px);border-color:#8ee06a}
  .kraina .ikony{font-size:30px;letter-spacing:2px;line-height:1.25}
  .kraina .tyt{font-weight:800;font-size:20px;margin:8px 0 2px}
  .kraina .op{font-size:12px;opacity:.7;line-height:1.35}
  .kraina .trud{font-size:12px;letter-spacing:3px;color:var(--akcent2);margin-top:4px}
  .kraina .trud i{opacity:.22;font-style:normal}
  .kraina .postep{margin-top:10px;font-size:13px;font-weight:700;color:var(--akcent);
    display:flex;align-items:center;gap:8px}
  .kraina .reset{
    margin-left:auto;background:rgba(255,255,255,.12);color:#eefaf0;border:1px solid var(--brzeg);
    border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;box-shadow:none;line-height:1.5;
  }
  .kraina .reset:hover{background:#ff8f7a;color:#3a0f06;transform:none;box-shadow:none}
  .kraina .reset:active{transform:translateY(1px);box-shadow:none}

  .ustawienia{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:14px}
  .ustawienia select{
    font:inherit;font-size:14px;font-weight:700;color:#eefaf0;background:#1b3a29;
    border:2px solid var(--brzeg);border-radius:12px;padding:8px 12px;max-width:320px;
  }
  .ustawienia label{opacity:.7}
  .kraina .pas{height:8px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px}
  .kraina .pas i{display:block;height:100%;background:linear-gradient(90deg,#8ee06a,#ffd166);transition:.4s width}
  .kraina.zamk{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
  .kraina.zamk:hover{transform:none;border-color:var(--brzeg)}
  .kraina .zamek{position:absolute;top:12px;right:14px;font-size:20px}
  .kraina.zrobiona{border-color:var(--akcent2)}
  .kraina .medal{position:absolute;top:10px;right:12px;font-size:24px}

  .rzad{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  button{
    font:inherit;font-weight:800;font-size:15px;color:#0a2a16;cursor:pointer;
    background:linear-gradient(180deg,#d6f5a8,var(--akcent2));
    border:0;border-radius:14px;padding:11px 22px;box-shadow:0 5px 0 #4f9a3a,0 8px 18px rgba(0,0,0,.3);
    transition:.1s transform,.1s box-shadow;
  }
  button:hover{transform:translateY(-2px);box-shadow:0 7px 0 #4f9a3a,0 10px 20px rgba(0,0,0,.35)}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #4f9a3a}
  button.drugi{background:linear-gradient(180deg,#ffe29a,var(--akcent));box-shadow:0 5px 0 #c99a34,0 8px 18px rgba(0,0,0,.3)}
  button.drugi:hover{box-shadow:0 7px 0 #c99a34,0 10px 20px rgba(0,0,0,.35)}
  button.drugi:active{box-shadow:0 2px 0 #c99a34}
  button.cichy{background:rgba(255,255,255,.12);color:#eefaf0;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  button.cichy:hover{box-shadow:0 6px 0 rgba(0,0,0,.25)}

  /* ---------- gra ---------- */
  #wrap{position:relative;width:100%;aspect-ratio:20/13;border-radius:18px;overflow:hidden;
        border:2px solid rgba(255,255,255,.22);box-shadow:0 18px 50px rgba(0,0,0,.5);background:#0a1a12}
  canvas#mapa{display:block;width:100%;height:100%;cursor:pointer;touch-action:none}

  /* krzyżak kierunkowy — pokazuje się tylko na ekranach dotykowych */
  #dpad{position:absolute;right:14px;bottom:14px;display:none;
        grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px;z-index:5}
  body.dotyk #dpad{display:grid}
  #dpad button{
    background:rgba(10,26,18,.55);border:2px solid rgba(255,255,255,.28);color:#eefaf0;
    border-radius:16px;font-size:24px;font-weight:900;padding:0;box-shadow:none;
    display:flex;align-items:center;justify-content:center;
  }
  #dpad button:active{background:var(--akcent);color:#0a2a16;transform:none;box-shadow:none}

  /* ekwipunek nałożony na mapę — żeby na tablecie nie trzeba było przewijać */
  /* wskazówki tropienia nałożone na mapę — w pełnym ekranie panel pod mapą się nie mieści */
  #tropyDotyk{position:absolute;left:12px;top:12px;display:none;gap:6px;flex-wrap:wrap;max-width:58%;z-index:5}
  body.dotyk #tropyDotyk{display:flex}
  #tropyDotyk .chip{
    display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
    background:rgba(10,26,18,.66);border:2px solid rgba(255,255,255,.22);
    font-size:15px;font-weight:900;color:#eefaf0;line-height:1;
  }
  #tropyDotyk .chip .e{font-size:20px;line-height:1}
  #tropyDotyk .chip .s{font-size:11px;font-weight:600;opacity:.75}
  #tropyDotyk .chip.trop{border-color:var(--akcent);color:var(--akcent)}
  #tropyDotyk .chip.ok{border-color:var(--akcent2)}

  /* na tablecie mapa dopasowuje się do wysokości ekranu, a panele schodzą na nią */
  body.dotyk #app{padding:6px;gap:6px}
  /* wysokość ograniczona tak, by szerokość wyliczona z proporcji 20:13
     nigdy nie wyszła poza ekran — inaczej mapa by się rozciągała */
  body.dotyk #wrap{
    width:auto;
    height:min(calc(100vh - 104px), calc((100vw - 14px) * 13 / 20));
    height:min(calc(100dvh - 104px), calc((100vw - 14px) * 13 / 20));
  }
  body.dotyk #plecak{display:none}
  body.dotyk #tropy{display:none}
  body.dotyk #paskiGry{margin-bottom:2px}
  body.dotyk .pod{margin-top:2px}

  #plecakDotyk{position:absolute;left:14px;bottom:14px;display:none;gap:8px;z-index:5}
  body.dotyk #plecakDotyk{display:flex}
  #plecakDotyk .rzeczD{
    position:relative;width:60px;height:60px;padding:0;border-radius:18px;
    background:rgba(10,26,18,.55);border:2px solid rgba(255,255,255,.28);box-shadow:none;
    display:flex;align-items:center;justify-content:center;
  }
  #plecakDotyk .rzeczD:active{background:var(--akcent);transform:none;box-shadow:none}
  #plecakDotyk .rzeczD .e{font-size:26px;line-height:1}
  #plecakDotyk .rzeczD .n{
    position:absolute;right:-3px;top:-5px;background:var(--akcent);color:#0a2a16;
    border-radius:999px;min-width:21px;height:21px;font-size:12px;font-weight:900;
    display:flex;align-items:center;justify-content:center;
  }
  #plecakDotyk .rzeczD.pusta{opacity:.35}
  #plecakDotyk .rzeczD.dziala{border-color:var(--akcent);background:rgba(255,209,102,.28)}
  #dpad .g{grid-area:1/2} #dpad .l{grid-area:2/1} #dpad .p{grid-area:2/3} #dpad .d{grid-area:3/2}

  /* na dotyku wszystko musi być łatwe do trafienia palcem */
  body.dotyk button{padding:13px 24px;font-size:16px}
  body.dotyk .rzecz{padding:12px 14px}
  body.dotyk .zwBtn{padding:12px 6px}
  body.dotyk .kraina{min-height:170px}
  body.dotyk .czytaj{padding:7px 14px;font-size:13px}
  body.dotyk .zw .czytaj{padding:6px 11px}
  @media (max-width:820px){
    #paskiGry .tytulMapy{font-size:17px}
    #paskiGry .info{font-size:12px}
    .pod{font-size:12px}
  }
  #obrocTablet{
    display:none;position:fixed;inset:0;z-index:99;background:var(--tlo2);
    align-items:center;justify-content:center;text-align:center;padding:30px;font-size:19px;font-weight:700;
  }
  @media (max-aspect-ratio: 3/4){ body.dotyk #obrocTablet{display:flex} }
  #naklad{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
          background:rgba(4,16,10,.74);backdrop-filter:blur(3px)}
  #naklad.ukryj{display:none}
  .panel{background:var(--panel);border:2px solid var(--brzeg);border-radius:22px;padding:24px 28px;text-align:center;max-width:520px}
  .panel h2{margin:0 0 8px;font-size:28px}
  .panel p{margin:8px 0;opacity:.88;font-size:15px;line-height:1.45}
  .panel .duzeEmoji{font-size:76px;line-height:1.1;margin:4px 0 6px}
  .panel .fakt{background:rgba(255,209,102,.14);border:1px solid rgba(255,209,102,.35);
    border-radius:14px;padding:12px 16px;font-size:15px;margin-top:12px}

  /* pasek tropienia pod mapa */
  /* plecak tropiciela */
  #plecak{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px;width:100%}
  .rzecz{
    display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:14px;text-align:left;
    background:rgba(255,255,255,.08);border:2px solid var(--brzeg);color:#eefaf0;
    box-shadow:none;font-weight:600;position:relative;
  }
  .rzecz:hover{transform:translateY(-2px);box-shadow:none;background:rgba(255,255,255,.14)}
  .rzecz:active{transform:translateY(1px);box-shadow:none}
  .rzecz .em{font-size:26px;line-height:1}
  .rzecz .op{display:flex;flex-direction:column;min-width:0}
  .rzecz .op b{font-size:14px}
  .rzecz .op small{font-size:11px;opacity:.65;line-height:1.25}
  .rzecz .ile{margin-left:auto;font-weight:900;font-size:17px;color:var(--akcent)}
  .rzecz .kl{position:absolute;top:4px;right:8px;font-size:10px;opacity:.45}
  .rzecz.pusta{opacity:.4}
  .rzecz.dziala{border-color:var(--akcent);background:rgba(255,209,102,.16)}

  /* wybór zwierzęcia do wybiegu */
  .wyborZw{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;
    max-height:44vh;overflow-y:auto;margin:12px 0;padding:4px}
  .zwBtn{
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;
    background:rgba(255,255,255,.08);border:2px solid var(--brzeg);color:#eefaf0;box-shadow:none;
  }
  .zwBtn:hover{transform:translateY(-2px);box-shadow:none;border-color:var(--akcent2)}
  .zwBtn:active{transform:translateY(1px);box-shadow:none}
  .zwBtn .em{font-size:30px;line-height:1.1}
  .zwBtn .nz{font-size:11px;font-weight:700;line-height:1.2}
  .zwBtn .gdzie{font-size:9px;opacity:.6}
  .zwBtn.tu{border-color:var(--akcent2);background:rgba(142,224,106,.18)}
  .zwBtn.zajete{opacity:.55}

  #tropy{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px;width:100%}
  .trop{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;
    background:rgba(255,255,255,.07);border:2px solid var(--brzeg);transition:.2s;
  }
  .trop .em{font-size:28px;line-height:1;filter:grayscale(1) brightness(.4)}
  .trop .txt{min-width:0}
  .trop .nz{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trop .st{font-size:12px;opacity:.7}
  .trop.tropiony{border-color:var(--akcent);background:rgba(255,209,102,.12)}
  .trop.tropiony .em{filter:none}
  .trop.znaleziony{border-color:var(--akcent2);background:rgba(142,224,106,.14)}
  .trop.znaleziony .em{filter:none}
  .trop .strzalka{margin-left:auto;font-size:22px;color:var(--akcent);font-weight:900}

  #paskiGry{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin-bottom:8px;flex-wrap:wrap}
  #paskiGry .tytulMapy{font-weight:800;font-size:20px}
  #paskiGry .info{opacity:.7;font-size:13px}

  /* ---------- album ---------- */
  .albumGrupa{margin-bottom:22px}
  .albumGrupa h3{margin:0 0 10px;font-size:19px;display:flex;align-items:center;gap:10px}
  .albumGrupa h3 small{font-weight:600;opacity:.55;font-size:13px}
  .karty{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .zw{
    border-radius:16px;padding:12px;text-align:center;border:2px solid var(--brzeg);
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  }
  .zw .em{font-size:40px;line-height:1.2}
  .zw .nz{font-weight:800;font-size:14px;margin-top:2px}
  .zw{position:relative}
  .zw .fk{font-size:11px;opacity:.7;line-height:1.35;margin-top:5px}
  .czytaj{
    background:rgba(255,255,255,.12);color:#eefaf0;border:1px solid var(--brzeg);
    border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;
    box-shadow:none;line-height:1.4;
  }
  .czytaj:hover{background:var(--akcent);color:#0a2a16;transform:none;box-shadow:none}
  .czytaj:active{transform:translateY(1px);box-shadow:none}
  .zw .czytaj{position:absolute;top:6px;right:6px;padding:2px 7px;font-size:11px}
  .albumGrupa h3 .czytaj{margin-left:auto}
  .mowi{animation:puls 1.1s ease-in-out infinite}
  @keyframes puls{0%,100%{opacity:1}50%{opacity:.55}}
  .zw.brak{opacity:.4}
  .zw.brak .em{filter:grayscale(1) brightness(.35)}

  .pod{text-align:center;opacity:.6;font-size:13px;margin-top:10px}
  kbd{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-bottom-width:2px;
      border-radius:6px;padding:1px 7px;font-family:inherit;font-size:12px}
</style>
</head>
<body>
<div id="obrocTablet">🔄<br>Obróć tablet poziomo,<br>żeby lepiej widzieć mapę</div>
<div id="app">

  <!-- EKRAN 1: wybor krainy -->
  <section id="ekranKrainy" class="screen on">
    <h1>Tropiciel Zwierząt</h1>
    <p class="podtytul" id="podtytulKrain">Zwiedzaj krainy, szukaj tropów i odkryj wszystkie zwierzęta</p>
    <div class="krainy" id="listaKrain"></div>
    <div class="ustawienia">
      <label for="wyborGlosu">Głos lektora:</label>
      <select id="wyborGlosu"></select>
      <button class="cichy" id="btnProbaGlosu">🔊 Wypróbuj</button>
    </div>
    <div class="rzad">
      <button class="cichy" id="btnDotyk">👆 Sterowanie</button>
      <button class="cichy" id="btnLektor">🔊 Lektor</button>
      <button id="btnZoo">🏛️ Moje ZOO</button>
      <button class="drugi" id="btnAlbum">📔 Mój album</button>
      <button class="cichy" id="btnResetGry">Zacznij od nowa</button>
    </div>
  </section>

  <!-- EKRAN 2: gra -->
  <section id="ekranGry" class="screen">
    <div id="paskiGry">
      <div>
        <div class="tytulMapy" id="tytulMapy"></div>
        <div class="info" id="infoMapy"></div>
      </div>
      <div class="rzad" style="margin:0">
        <button class="cichy" id="btnPelnyEkran">⛶</button>
        <button class="cichy" id="btnDoKrain">← Mapa świata</button>
      </div>
    </div>
    <div id="wrap">
      <canvas id="mapa" width="960" height="624"></canvas>
      <div id="tropyDotyk"></div>
      <div id="plecakDotyk"></div>
      <div id="dpad">
        <button class="g" data-kier="g">▲</button>
        <button class="l" data-kier="l">◀</button>
        <button class="p" data-kier="p">▶</button>
        <button class="d" data-kier="d">▼</button>
      </div>
      <div id="naklad" class="ukryj"><div class="panel" id="panel"></div></div>
    </div>
    <div id="plecak"></div>
    <div id="tropy"></div>
    <p class="pod">Chodź <kbd>strzałkami</kbd> lub <kbd>WSAD</kbd> &nbsp;•&nbsp; kliknij w mapę, żeby tam pójść &nbsp;•&nbsp;
       ekwipunek na klawiszach <kbd>1</kbd>–<kbd>4</kbd> &nbsp;•&nbsp; w ZOO <kbd>E</kbd> otwiera wybieg</p>
  </section>

  <!-- EKRAN 3: album -->
  <section id="ekranAlbum" class="screen">
    <h1>Mój album</h1>
    <p class="podtytul" id="podtytulAlbum"></p>
    <div class="rzad" style="margin:0 0 18px">
      <button class="drugi" id="btnCzytajAlbum">🔊 Przeczytaj cały album</button>
      <button class="cichy" id="btnStopLektor">⏹️ Zatrzymaj</button>
    </div>
    <div id="albumTresc"></div>
    <div class="rzad">
      <button id="btnAlbumWroc">← Wróć do map</button>
      <button class="drugi" id="btnZooZAlbumu">🏛️ Ustaw w ZOO</button>
    </div>
  </section>

</div>
<script>
"use strict";
/* =========================================================
   TROPICIEL ZWIERZĄT — eksploracja map i tropienie zwierząt
   ========================================================= */

const T   = 48;                 // rozmiar kafla w pikselach
const W   = 960, H = 624;       // widoczny kawałek mapy (20 x 13 kafli)
const MW  = 40, MH = 30;        // rozmiar mapy w kaflach
const ZASIEG = 3.4;             // ile kafli dookoła siebie odsłania gracz
let lornetkaCzas = 0;           // ile sekund jeszcze działa lornetka
function zasieg(){
  const baza = (M && M.trud) ? M.trud.zasieg : ZASIEG;
  return baza + (lornetkaCzas > 0 ? 3.4 : 0);
}

const cv  = document.getElementById('mapa');
const ctx = cv.getContext('2d');

const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const kafelId = (x,y) => y*MW + x;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* stały "szum" na podstawie współrzędnych — do drobnych ozdób terenu */
function hash2(x,y){ let h = x*374761393 + y*668265263; h = (h^(h>>13))*1274126177; return ((h^(h>>16))>>>0)/4294967296; }

/* ---------- dźwięk ---------- */
let AC = null;
function ton(f,d,typ,v){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=typ||'sine'; o.frequency.setValueAtTime(f,AC.currentTime);
    g.gain.setValueAtTime(v||0.05,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+d);
  }catch(e){}
}

/* =========================================================
   LEKTOR — czyta ciekawostki na głos
   Korzysta z syntezatora mowy wbudowanego w przeglądarkę. Jeśli w systemie
   jest głos polski, wybieramy go; jeśli nie, czyta głos domyślny.
   ========================================================= */
let lektorWl = true;
let glosPL = null;

/* Ocena głosu — im wyżej, tym naturalniej brzmi.
   Głosy "Natural"/"Online" to neuronowe głosy Edge (brzmią jak człowiek),
   warianty "Desktop" to stare, robotyczne głosy SAPI — bierzemy je na końcu. */
function ocenGlos(g){
  let p = 0;
  if(/^pl/i.test(g.lang) || /polish|polski/i.test(g.name)) p += 100; else p -= 200;
  if(/natural|neural|online/i.test(g.name)) p += 60;
  if(/desktop/i.test(g.name)) p -= 40;
  if(g.localService === false) p += 10;
  return p;
}
function listaGlosow(){
  try{ return (window.speechSynthesis.getVoices() || []).slice(); }catch(e){ return []; }
}
function szukajGlosu(){
  const glosy = listaGlosow();
  if(!glosy.length) return;
  if(postep.glos){
    const wybrany = glosy.find(g => g.name === postep.glos);
    if(wybrany){ glosPL = wybrany; odswiezListeGlosow(); return; }
  }
  const posortowane = glosy.slice().sort((a,b) => ocenGlos(b) - ocenGlos(a));
  glosPL = (posortowane[0] && ocenGlos(posortowane[0]) > 0) ? posortowane[0] : null;
  odswiezListeGlosow();
}

/* usuwa emoji i znaczki, żeby lektor nie czytał ich nazw */
function bezEmoji(t){
  return String(t).replace(/[\u2000-\uFFFF]/g, ' ').replace(/[\uD800-\uDFFF]/g, '')
                  .replace(/\s+/g, ' ').trim();
}

/* polska odmiana: 1 zwierzę, 2 zwierzęta, 5 zwierząt */
function odmiana(n, jeden, kilka, wiele){
  if(n === 1) return jeden;
  const d = n % 10, st = n % 100;
  return (d >= 2 && d <= 4 && (st < 10 || st > 20)) ? kilka : wiele;
}
if(window.speechSynthesis){
  szukajGlosu();
  window.speechSynthesis.onvoiceschanged = szukajGlosu;
  // Chrome potrafi uciszyć dłuższą wypowiedź po kilkunastu sekundach
  setInterval(() => {
    try{ if(window.speechSynthesis.speaking) window.speechSynthesis.resume(); }catch(e){}
  }, 7000);
}

function zdanie(tekst){
  const u = new SpeechSynthesisUtterance(bezEmoji(tekst));
  u.lang = 'pl-PL';
  u.rate = glosPL && /natural|neural|online/i.test(glosPL.name) ? 1.0 : 0.92;
  u.pitch = 1.05;
  if(glosPL) u.voice = glosPL;
  return u;
}
function mow(tekst){
  if(!lektorWl || !window.speechSynthesis) return;
  try{ window.speechSynthesis.cancel(); window.speechSynthesis.speak(zdanie(tekst)); }catch(e){}
}
function mowWiele(teksty){
  if(!lektorWl || !window.speechSynthesis || !teksty.length) return;
  try{
    window.speechSynthesis.cancel();
    teksty.forEach(t => window.speechSynthesis.speak(zdanie(t)));
  }catch(e){}
}
function cisza(){ try{ window.speechSynthesis.cancel(); }catch(e){} }
function opisZwierza(z){ return z.nazwa + '. ' + z.fakt; }

/* lista głosów do wyboru w menu */
function odswiezListeGlosow(){
  const sel = document.getElementById('wyborGlosu');
  if(!sel) return;
  const glosy = listaGlosow().slice().sort((a,b) => ocenGlos(b) - ocenGlos(a));
  if(!glosy.length){ sel.innerHTML = '<option>brak głosów w przeglądarce</option>'; return; }
  sel.innerHTML = glosy.map(g =>
    '<option value="' + g.name.split(String.fromCharCode(34)).join('') + '"' + (glosPL && g.name === glosPL.name ? ' selected' : '') + '>' +
    g.name + (/^pl/i.test(g.lang) ? '' : '  (' + g.lang + ')') + '</option>').join('');
}

const ILE_ZWIERZAT = 5;   // na każdej mapie

/* ---------- KRZYWA TRUDNOŚCI ----------
   Wszystkie parametry wynikają z numeru krainy, więc każda kolejna jest
   odrobinę trudniejsza od poprzedniej. Liczba zwierząt zostaje stała (5),
   bo tyle gatunków ma opisanych każda kraina — rośnie trud ich znalezienia. */
function trudnosc(idx){
  const p = KRAINY.length > 1 ? idx / (KRAINY.length - 1) : 0;   // 0 = pierwsza, 1 = ostatnia
  return {
    poziom:     1 + Math.floor(idx / 8),          // 1-5, pokazywane na kafelku krainy
    zasieg:     +(3.4 - 1.2*p).toFixed(2),        // widać 3.4 -> 2.2 kafla dookoła
    tropy:      Math.round(4 - 2*p),              // 4 -> 2 ślady wokół zwierzęcia
    wedrowka:   Math.round(2 + 4*p),              // zwierzę odchodzi 2 -> 6 kafli od legowiska
    przedmioty: Math.round(5 - 3*p),              // 5 -> 2 przedmioty do znalezienia
    minDystans: Math.round(9 + 6*p),              // zwierzęta chowają się 9 -> 15 kafli od startu
    poswiata:   p < 0.6                           // od ~25. krainy zwierzęta już nie świecą
  };
}

   znalezieniu ostatniego zwierzaka, jak i przy wejściu na ekran map — dzięki
   temu naprawiają się też starsze zapisy, w których odblokowanie przepadło. */
function odblokujZdobyte(){
  let zmiana = false;
  KRAINY.forEach((K, i) => {
    if(znalezioneW(K.id).length >= ILE_ZWIERZAT && postep.odblok < i + 2){
      postep.odblok = Math.min(KRAINY.length, i + 2);
      zmiana = true;
    }
  });
  if(zmiana) zapisz();
  return zmiana;
}
function czyZnalezione(idKrainy, i){ return znalezioneW(idKrainy).indexOf(i) >= 0; }
function razemZnalezionych(){
  return KRAINY.reduce((s,k) => s + znalezioneW(k.id).length, 0);
}

/* =========================================================
   GENEROWANIE MAPY
   Każda kraina ma swoje ziarno, więc mapa zawsze wygląda tak samo
   i zapamiętana mgła pasuje do terenu po powrocie do gry.
   ========================================================= */
const TRAWA=0, KRZAK=1, PRZESZKODA=2, WODA=3, SCIEZKA=4, PLOT=5, WYBIEG=6;

function przejezdny(k){ return k === TRAWA || k === KRZAK || k === SCIEZKA; }

function generujMape(idx){
  const K = KRAINY[idx], D = trudnosc(idx);
  const rng = mulberry32(1000 + idx*7919);

  /* --- 1. teren z gładkiego szumu: duże plamy + drobniejsze detale --- */
  function warstwa(komorka){
    const gw = Math.ceil(MW/komorka)+2, gh = Math.ceil(MH/komorka)+2;
    const p = new Float32Array(gw*gh);
    for(let i=0;i<p.length;i++) p[i] = rng();
    return (x,y) => {
      const fx = x/komorka, fy = y/komorka;
      const x0 = Math.min(gw-2, Math.floor(fx)), y0 = Math.min(gh-2, Math.floor(fy));
      const tx = fx-x0, ty = fy-y0;
      const sx = tx*tx*(3-2*tx), sy = ty*ty*(3-2*ty);      // wygładzenie
      const a = p[y0*gw+x0],     b = p[y0*gw+x0+1];
      const c = p[(y0+1)*gw+x0], d = p[(y0+1)*gw+x0+1];
      const g1 = a+(b-a)*sx, g2 = c+(d-c)*sx;
      return g1 + (g2-g1)*sy;
    };
  }
  const duze = warstwa(6), drobne = warstwa(2.5);

  const kafle = new Uint8Array(MW*MH);
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const v = duze(x,y)*0.72 + drobne(x,y)*0.28;
    let k = TRAWA;
    if(v < K.progWody)        k = WODA;
    else if(v > K.progLasu)   k = PRZESZKODA;
    else if(v > K.progKrzaka) k = KRZAK;
    // pojedyncze drzewa i głazy rozsiane po terenie
    if(k === TRAWA && rng() < 0.05) k = PRZESZKODA;
    if(k === TRAWA && rng() < 0.09) k = KRZAK;
    kafle[y*MW+x] = k;
  }
  // ramka nie do przejścia — mapa ma swoje granice
  for(let x=0;x<MW;x++){ kafle[x] = PRZESZKODA; kafle[(MH-1)*MW+x] = PRZESZKODA; }
  for(let y=0;y<MH;y++){ kafle[y*MW] = PRZESZKODA; kafle[y*MW+MW-1] = PRZESZKODA; }

  /* --- 2. punkt startowy: środek NAJWIĘKSZEGO spójnego kawałka lądu.
     Bez tego przy pechowym losowaniu gracz mógłby wylądować w kieszeni
     odciętej wodą i lasem, z której nie da się nigdzie dojść. --- */
  const skladowa = new Int32Array(MW*MH).fill(-1);
  let numer = 0, najwiekszaNr = -1, najwiekszaIle = 0;
  for(let i=0;i<kafle.length;i++){
    if(skladowa[i] >= 0 || !przejezdny(kafle[i])) continue;
    const kol = [i]; skladowa[i] = numer;
    for(let g=0; g<kol.length; g++){
      const j = kol[g], jx = j%MW, jy = (j/MW)|0;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx = jx+dx, ny = jy+dy;
        if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
        const k2 = ny*MW+nx;
        if(skladowa[k2] >= 0 || !przejezdny(kafle[k2])) continue;
        skladowa[k2] = numer; kol.push(k2);
      }
    }
    if(kol.length > najwiekszaIle){ najwiekszaIle = kol.length; najwiekszaNr = numer; }
    numer++;
  }
  let start = null, najl = 1e9;
  for(let y=1;y<MH-1;y++) for(let x=1;x<MW-1;x++){
    if(skladowa[y*MW+x] !== najwiekszaNr) continue;
    const d = (x-MW/2)*(x-MW/2) + (y-MH/2)*(y-MH/2);
    if(d < najl){ najl = d; start = {x,y}; }
  }
  // wokół startu robimy małą polanę, żeby zawsze było gdzie ruszyć
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    const x = start.x+dx, y = start.y+dy;
    if(x>0 && y>0 && x<MW-1 && y<MH-1 && kafle[y*MW+x] !== WODA) kafle[y*MW+x] = TRAWA;
  }

  /* --- 3. co jest osiągalne ze startu (BFS) --- */
  const dyst = odlegloscOd(kafle, start.x, start.y);

  /* --- 4. zwierzęta: daleko od startu i daleko od siebie --- */
  let kandydaci = [];
  const zbierz = minD => {
    const t = [];
    for(let y=1;y<MH-1;y++) for(let x=1;x<MW-1;x++){
      const d = dyst[y*MW+x];
      if(d >= minD && d < 1e8) t.push({x,y,d});
    }
    return t;
  };
  kandydaci = zbierz(D.minDystans);
  if(kandydaci.length < 30) kandydaci = zbierz(4);   // ciasna mapa — luzujemy wymagania
  if(kandydaci.length < ILE_ZWIERZAT) kandydaci = zbierz(1);
  // tasujemy deterministycznie
  for(let i=kandydaci.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    const t = kandydaci[i]; kandydaci[i] = kandydaci[j]; kandydaci[j] = t;
  }
  const zwierzeta = [];
  let minOdstep = 9;
  while(zwierzeta.length < ILE_ZWIERZAT && minOdstep > -1){
    for(const c of kandydaci){
      if(zwierzeta.length >= ILE_ZWIERZAT) break;
      if(zwierzeta.some(z => Math.abs(z.x-c.x) + Math.abs(z.y-c.y) < minOdstep)) continue;
      const i = zwierzeta.length;
      zwierzeta.push(Object.assign({}, K.zwierzeta[i], {
        i, x:c.x, y:c.y, domX:c.x, domY:c.y,
        znalezione: czyZnalezione(K.id, i), tropione:false, ruch:0
      }));
    }
    minOdstep -= 2;
  }

  /* --- 5. ślady: 4 tropy wokół każdego zwierzęcia --- */
  const slady = [];
  zwierzeta.forEach(z => {
    const d2 = odlegloscOd(kafle, z.x, z.y);
    const wokol = [];
    for(let y=1;y<MH-1;y++) for(let x=1;x<MW-1;x++){
      const d = d2[y*MW+x];
      if(d >= 2 && d <= 6) wokol.push({x,y});
    }
    for(let n=0;n<D.tropy && wokol.length;n++){
      const j = Math.floor(rng()*wokol.length);
      const p = wokol.splice(j,1)[0];
      if(slady.some(s => s.x===p.x && s.y===p.y)) continue;
      slady.push({x:p.x, y:p.y, zw:z.i, obrot: rng()*0.8-0.4});
    }
  });

  /* --- 5b. przedmioty tropiciela porozrzucane po okolicy --- */
  const przedmioty = [];
  const zebraneTu = postep.zebrane[K.id] || [];
  const poleNaRzecz = kandydaci.filter(c => c.d >= 4);
  for(let i=0; i<D.przedmioty && poleNaRzecz.length; i++){
    const p = poleNaRzecz[Math.floor(rng()*poleNaRzecz.length)];
    const typ = TYPY_PRZEDMIOTOW[Math.floor(rng()*TYPY_PRZEDMIOTOW.length)];
    if(przedmioty.some(q => q.x === p.x && q.y === p.y)) continue;
    if(zwierzeta.some(z => z.x === p.x && z.y === p.y)) continue;
    przedmioty.push({i, x:p.x, y:p.y, typ, wziety: zebraneTu.indexOf(i) >= 0});
  }

  /* --- 6. mgła: wczytana z zapisu albo świeża --- */
  const mgla = new Uint8Array(MW*MH);
  const zapis = (postep.mgla || {})[K.id];
  if(typeof zapis === 'string' && zapis.length === MW*MH){
    for(let i=0;i<mgla.length;i++) mgla[i] = zapis.charCodeAt(i) === 49 ? 1 : 0;
  }

  return {idx, K, kafle, start, zwierzeta, slady, przedmioty, mgla, dyst, trud:D};
}

/* BFS po przejezdnych kaflach — zwraca tablicę odległości (1e9 = nieosiągalne) */
function odlegloscOd(kafle, sx, sy){
  const d = new Float64Array(MW*MH).fill(1e9);
  const kol = new Int32Array(MW*MH);
  let gl=0, kn=0;
  d[sy*MW+sx] = 0; kol[kn++] = sy*MW+sx;
  while(gl < kn){
    const i = kol[gl++], x = i%MW, y = (i/MW)|0;
    const nast = [[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
    for(const [nx,ny] of nast){
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const j = ny*MW+nx;
      if(d[j] < 1e8 || !przejezdny(kafle[j])) continue;
      d[j] = d[i]+1; kol[kn++] = j;
    }
  }
  return d;
}

/* najkrótsza droga z (sx,sy) do (cx,cy) jako lista kroków */
function znajdzDroge(kafle, sx, sy, cx, cy){
  if(!przejezdny(kafle[cy*MW+cx])) return null;
  const d = odlegloscOd(kafle, cx, cy);         // liczymy od celu, potem schodzimy w dół
  if(d[sy*MW+sx] > 1e8) return null;
  const droga = [];
  let x = sx, y = sy;
  let bezpiecznik = MW*MH;
  while((x !== cx || y !== cy) && bezpiecznik-- > 0){
    let naj = null, najD = d[y*MW+x];
    for(const [nx,ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]]){
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      if(d[ny*MW+nx] < najD){ najD = d[ny*MW+nx]; naj = {x:nx,y:ny}; }
    }
    if(!naj) break;
    droga.push(naj); x = naj.x; y = naj.y;
  }
  return droga;
}

   RYSOWANIE TERENU
   ========================================================= */
function rysujDrzewo(sx, sy, rodzaj, K, s){
  const cx = sx + T/2, dol = sy + T - 5;
  if(rodzaj === 'swierk'){
    ctx.fillStyle = K.pien; ctx.fillRect(cx-3, dol-10, 6, 12);
    ctx.fillStyle = K.drzewo;
    for(let i=0;i<3;i++){
      const w = 20 - i*4, h = 15;
      ctx.beginPath();
      ctx.moveTo(cx, dol-16-i*10-h); ctx.lineTo(cx-w, dol-10-i*10); ctx.lineTo(cx+w, dol-10-i*10);
      ctx.closePath(); ctx.fill();
    }
  } else if(rodzaj === 'akacja'){
    ctx.fillStyle = K.pien; ctx.fillRect(cx-3, dol-20, 6, 22);
    ctx.fillStyle = K.drzewo;
    ctx.beginPath(); ctx.ellipse(cx, dol-24, 20, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx-7, dol-30, 12, 7, 0, 0, Math.PI*2); ctx.fill();
  } else if(rodzaj === 'palma'){
    ctx.strokeStyle = K.pien; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, dol); ctx.quadraticCurveTo(cx-4, dol-18, cx+2, dol-30); ctx.stroke();
    ctx.fillStyle = K.drzewo;
    for(let i=0;i<5;i++){
      const a = -Math.PI/2 + (i-2)*0.6;
      ctx.save(); ctx.translate(cx+2, dol-30); ctx.rotate(a);
      ctx.beginPath(); ctx.ellipse(0, -11, 5, 13, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  } else if(rodzaj === 'kaktus'){
    ctx.fillStyle = K.drzewo; ctx.lineCap = 'round';
    ctx.strokeStyle = K.drzewo; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(cx, dol); ctx.lineTo(cx, dol-28); ctx.stroke();
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(cx-1, dol-14); ctx.lineTo(cx-10, dol-14); ctx.lineTo(cx-10, dol-22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+1, dol-19); ctx.lineTo(cx+9, dol-19); ctx.lineTo(cx+9, dol-25); ctx.stroke();
  } else if(rodzaj === 'lod'){
    ctx.fillStyle = '#bcd9ea';
    ctx.beginPath();
    ctx.moveTo(cx-14, dol); ctx.lineTo(cx-8, dol-26); ctx.lineTo(cx+2, dol-34);
    ctx.lineTo(cx+11, dol-22); ctx.lineTo(cx+14, dol); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#eaf6ff';
    ctx.beginPath();
    ctx.moveTo(cx+2, dol-34); ctx.lineTo(cx+11, dol-22); ctx.lineTo(cx+14, dol); ctx.lineTo(cx+5, dol);
    ctx.closePath(); ctx.fill();
  } else if(rodzaj === 'trzcina'){
    ctx.strokeStyle = K.drzewo; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for(let i=0;i<4;i++){
      const ox = cx - 12 + i*8, wys = 20 + ((i*7 + s*13)%12);
      ctx.beginPath(); ctx.moveTo(ox, dol); ctx.lineTo(ox + (i%2?3:-3), dol-wys); ctx.stroke();
      ctx.fillStyle = '#8a6a3a';
      ctx.beginPath(); ctx.ellipse(ox + (i%2?3:-3), dol-wys-3, 2.4, 5, 0, 0, Math.PI*2); ctx.fill();
    }
  } else if(rodzaj === 'bambus'){
    ctx.strokeStyle = K.drzewo; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for(let i=0;i<3;i++){
      const ox = cx - 10 + i*10, wys = 26 + ((i*11 + s*17)%10);
      ctx.beginPath(); ctx.moveTo(ox, dol); ctx.lineTo(ox, dol-wys); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1.5;
      for(let j=1;j<3;j++){
        ctx.beginPath(); ctx.moveTo(ox-3, dol-wys*j/3); ctx.lineTo(ox+3, dol-wys*j/3); ctx.stroke();
      }
      ctx.strokeStyle = K.drzewo; ctx.lineWidth = 5;
    }
  } else if(rodzaj === 'kwiaty'){
    const kolory = ['#ff8fb1','#ffd166','#c68fff','#fff1a8'];
    for(let i=0;i<4;i++){
      const ox = cx - 14 + i*9, wys = 15 + ((i*13 + s*29)%12), gx = ox + (i%2 ? 2 : -2);
      ctx.strokeStyle = K.drzewo; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ox, dol); ctx.lineTo(gx, dol-wys); ctx.stroke();
      ctx.fillStyle = kolory[(i + Math.floor(s*4)) % 4];
      ctx.beginPath(); ctx.arc(gx, dol-wys-3, 4.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff6c9';
      ctx.beginPath(); ctx.arc(gx, dol-wys-3, 1.8, 0, Math.PI*2); ctx.fill();
    }
  } else if(rodzaj === 'jablon'){
    ctx.fillStyle = K.pien; ctx.fillRect(cx-4, dol-16, 8, 18);
    ctx.fillStyle = K.drzewo;
    ctx.beginPath(); ctx.arc(cx-10, dol-20, 9, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+10, dol-20, 9, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, dol-27, 15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    ctx.beginPath(); ctx.arc(cx-5, dol-32, 6, 0, Math.PI*2); ctx.fill();
    if(s > 0.45){
      ctx.fillStyle = '#e8563f';
      for(let i=0;i<3;i++){
        const ax = cx - 8 + i*8, ay = dol - 22 - ((i*7 + s*19)%10);
        ctx.beginPath(); ctx.arc(ax, ay, 2.8, 0, Math.PI*2); ctx.fill();
      }
    }
  } else if(rodzaj === 'koral'){
    const kolory = ['#ff8fa3','#ffb26b','#c08fe0','#7fe0d0'];
    const kol = kolory[Math.floor(s*4) % 4];
    ctx.strokeStyle = kol; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, dol); ctx.lineTo(cx, dol-13); ctx.stroke();
    ctx.lineWidth = 4;
    for(let i=0;i<3;i++){
      const a = -Math.PI/2 + (i-1)*0.75;
      ctx.beginPath();
      ctx.moveTo(cx, dol-13);
      ctx.lineTo(cx + Math.cos(a)*14, dol-13 + Math.sin(a)*14);
      ctx.stroke();
      ctx.fillStyle = kol;
      ctx.beginPath(); ctx.arc(cx + Math.cos(a)*15, dol-13 + Math.sin(a)*15, 3.4, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.arc(cx-5, dol-21, 2.8, 0, Math.PI*2); ctx.fill();
  } else if(rodzaj === 'paproc'){
    ctx.strokeStyle = K.pien; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, dol); ctx.lineTo(cx, dol-12); ctx.stroke();
    for(let i=0;i<5;i++){
      const a = -Math.PI/2 + (i-2)*0.55;
      const dx = Math.cos(a)*21, dy = Math.sin(a)*21;
      ctx.strokeStyle = K.drzewo; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx, dol-12);
      ctx.quadraticCurveTo(cx + dx*0.5, dol-12 + dy*0.95, cx + dx, dol-12 + dy);
      ctx.stroke();
      ctx.lineWidth = 1.5;
      for(let j=1;j<=3;j++){
        const px = cx + dx*j/3.6, py = dol-12 + dy*j/3.2;
        ctx.beginPath(); ctx.moveTo(px, py);
        ctx.lineTo(px + Math.cos(a+1.25)*5, py + Math.sin(a+1.25)*5); ctx.stroke();
      }
    }
  }
}

function rysujSkale(sx, sy, K, s){
  const cx = sx + T/2, dol = sy + T - 6;
  ctx.fillStyle = K.skala;
  ctx.beginPath();
  ctx.moveTo(cx-16, dol); ctx.lineTo(cx-10, dol-14); ctx.lineTo(cx-1, dol-19);
  ctx.lineTo(cx+11, dol-12); ctx.lineTo(cx+16, dol); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.16)';
  ctx.beginPath();
  ctx.moveTo(cx-1, dol-19); ctx.lineTo(cx+11, dol-12); ctx.lineTo(cx+16, dol); ctx.lineTo(cx+2, dol);
  ctx.closePath(); ctx.fill();
  if(s > 0.6){
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.beginPath(); ctx.ellipse(cx-6, dol-13, 5, 3, -0.3, 0, Math.PI*2); ctx.fill();
  }
}

function rysujKafel(k, sx, sy, x, y, K){
  const s = hash2(x,y);
  if(k === SCIEZKA){                       // alejka w zoo
    ctx.fillStyle = '#cdb387'; ctx.fillRect(sx, sy, T, T);
    ctx.fillStyle = 'rgba(120,90,50,.18)';
    for(let i=0;i<5;i++){
      const gx = sx + ((s*97*(i+1))%1)*42, gy = sy + ((s*61*(i+2))%1)*42;
      ctx.fillRect(gx, gy, 5, 3);
    }
    return;
  }
  if(k === WYBIEG){                        // wnętrze wybiegu
    ctx.fillStyle = '#8db869'; ctx.fillRect(sx, sy, T, T);
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2;
    for(let i=0;i<3;i++){
      const gx = sx + 8 + ((s*53*(i+1))%1)*30, gy = sy + 10 + ((s*89*(i+3))%1)*28;
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx+2, gy-6); ctx.stroke();
    }
    return;
  }
  if(k === PLOT){                          // płot dookoła wybiegu
    ctx.fillStyle = '#8db869'; ctx.fillRect(sx, sy, T, T);
    ctx.fillStyle = '#a3763f';
    ctx.fillRect(sx, sy+16, T, 5);
    ctx.fillRect(sx, sy+30, T, 5);
    ctx.fillStyle = '#8a6134';
    ctx.fillRect(sx+5, sy+8, 6, 34);
    ctx.fillRect(sx+T-11, sy+8, 6, 34);
    return;
  }
  if(k === WODA){
    ctx.fillStyle = K.woda; ctx.fillRect(sx, sy, T, T);
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for(let i=0;i<2;i++){
      const fy = sy + 14 + i*18 + Math.sin(czas*1.6 + x + y + i)*2.5;
      ctx.beginPath();
      ctx.moveTo(sx+8, fy); ctx.quadraticCurveTo(sx+T/2, fy-4, sx+T-8, fy); ctx.stroke();
    }
    return;
  }
  // podłoże
  ctx.fillStyle = K.trawa[s > 0.5 ? 0 : 1];
  ctx.fillRect(sx, sy, T, T);
  // kępki trawy
  ctx.strokeStyle = 'rgba(0,0,0,.10)'; ctx.lineWidth = 2;
  for(let i=0;i<3;i++){
    const gx = sx + 6 + ((s*97*(i+1))%1)*36, gy = sy + 8 + ((s*53*(i+2))%1)*32;
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx+2, gy-5); ctx.stroke();
  }
  if(k === KRZAK){
    ctx.fillStyle = K.krzak;
    ctx.beginPath(); ctx.arc(sx+18, sy+30, 11, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+30, sy+27, 13, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+24, sy+20, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.beginPath(); ctx.arc(sx+27, sy+21, 5, 0, Math.PI*2); ctx.fill();
  } else if(k === PRZESZKODA){
    if(s < 0.28) rysujSkale(sx, sy, K, s);
    else rysujDrzewo(sx, sy, K.rodzaj, K, s);
  }
}

function zaokrRect(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){ ctx.roundRect(x,y,w,h,r); }
  else {
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  }
  ctx.fill();
}

function zapiszMgle(){
  if(!M) return;
  let s = '';
  for(let i=0;i<M.mgla.length;i++) s += M.mgla[i] ? '1' : '0';
  postep.mgla[M.K.id] = s;
  brudna = false;
}

function procentOdkryty(){
  let n = 0;
  for(let i=0;i<M.mgla.length;i++) if(M.mgla[i]) n++;
  return Math.round(n / M.mgla.length * 100);
}

    : 'Tę krainę masz już zbadaną.')), 350);
  ostatni = 0;
  if(!animId) animId = requestAnimationFrame(petla);
}

/* odsłania mgłę wokół gracza i sprawdza, czy nie natknął się na tropy */
function odsloniec(cicho){
  const zs = zasieg(), r = Math.ceil(zs);
  for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(dx*dx + dy*dy > zs*zs) continue;
    const x = P.x+dx, y = P.y+dy;
    if(x<0||y<0||x>=MW||y>=MH) continue;
    const i = y*MW+x;
    if(!M.mgla[i]){ M.mgla[i] = 1; brudna = true; }
  }
  for(const s of M.slady){
    if(!M.mgla[s.y*MW + s.x]) continue;
    const z = M.zwierzeta[s.zw];
    if(z && !z.tropione && !z.znalezione){
      z.tropione = true;
      if(!cicho){
        sfx.trop();
        M.komunikat = {txt:'🐾 Świeże tropy! Ktoś tędy przechodził…', t:2.6};
        mow('Świeże tropy! Idź w stronę strzałki, ktoś tu jest blisko.');
      }
      rysujTropy();
    }
  }
}

function ustawKamere(odrazu){
  const celX = clamp(P.px + T/2 - W/2, 0, MW*T - W);
  const celY = clamp(P.py + T/2 - H/2, 0, MH*T - H);
  if(odrazu){ kam.x = celX; kam.y = celY; }
  else { kam.x += (celX - kam.x)*0.20; kam.y += (celY - kam.y)*0.20; }
}

/* =========================================================
   RUCH
   ========================================================= */
function sprobujKrok(dx, dy){
  if(P.ruch || panelOtwarty) return false;
  const nx = P.x+dx, ny = P.y+dy;
  if(nx<0||ny<0||nx>=MW||ny>=MH) return false;
  if(!przejezdny(M.kafle[ny*MW+nx])){ sfx.blok(); return false; }
  if(dx) P.kier = dx > 0 ? 1 : -1;
  P.ruch = {x0:P.x, y0:P.y, x1:nx, y1:ny, t:0};
  return true;
}

function zakonczKrok(){
  P.x = P.ruch.x1; P.y = P.ruch.y1;
  P.px = P.x*T; P.py = P.y*T;
  P.ruch = null;
  postep.kroki++;
  sfx.krok();
  if(M.zoo){ sprawdzTabliczke(); return; }
  odsloniec(false);
  podnies();
  sprawdzOdkrycie();
}

/* podnoszenie przedmiotu, na którym stoimy */
function podnies(){
  for(const p of M.przedmioty){
    if(p.wziety || p.x !== P.x || p.y !== P.y) continue;
    p.wziety = true;
    postep.plecak[p.typ] = (postep.plecak[p.typ] || 0) + 1;
    const lista = (postep.zebrane[M.K.id] || []).slice();
    lista.push(p.i);
    postep.zebrane[M.K.id] = lista;
    zapisz(); sfx.trop();
    M.komunikat = {txt: PRZEDMIOTY[p.typ].em + '  Znalazłeś: ' + PRZEDMIOTY[p.typ].nazwa + '!', t:2.8};
    rysujPlecak();
  }
}

function sprawdzOdkrycie(){
  for(const z of M.zwierzeta){
    if(z.znalezione) continue;
    if(Math.abs(z.x-P.x) + Math.abs(z.y-P.y) <= 1){
      z.znalezione = true; z.tropione = true;
      const lista = znalezioneW(M.K.id).slice();
      if(lista.indexOf(z.i) < 0) lista.push(z.i);
      postep.znalezione[M.K.id] = lista;
      kolejka = [];
      zapiszMgle(); zapisz();
      odblokujZdobyte();
      sfx.odkrycie();
      rysujTropy(); aktualizujInfo();
      pokazZwierze(z);
      return;
    }
  }
}

function ruszajZwierzeta(dt){
  const promien = (M.trud ? M.trud.wedrowka : 2);
  for(const z of M.zwierzeta){
    if(z.znalezione) continue;
    if(z.wabik){ z.wabik.t -= dt; if(z.wabik.t <= 0) z.wabik = null; }
    z.ruch -= dt;
    if(z.ruch > 0) continue;
    z.ruch = z.wabik ? 24 : (100 + Math.random()*120);
    const opcje = [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy]) => {
      const nx = z.x+dx, ny = z.y+dy;
      if(nx<=0 || ny<=0 || nx>=MW-1 || ny>=MH-1) return false;
      if(!przejezdny(M.kafle[ny*MW+nx])) return false;
      if(z.wabik) return true;                       // za karmą idzie gdziekolwiek
      return Math.abs(nx-z.domX) <= promien && Math.abs(ny-z.domY) <= promien;
    });
    if(opcje.length){
      let w;
      if(z.wabik){                                   // krok w stronę karmy
        w = opcje.reduce((a,b) => {
          const da = Math.abs(z.x+a[0]-z.wabik.x) + Math.abs(z.y+a[1]-z.wabik.y);
          const db = Math.abs(z.x+b[0]-z.wabik.x) + Math.abs(z.y+b[1]-z.wabik.y);
          return db < da ? b : a;
        });
      } else w = opcje[Math.floor(Math.random()*opcje.length)];
      z.x += w[0]; z.y += w[1];
    }
  }
}

function aktualizuj(dt){
  if(P.ruch){
    P.ruch.t += dt/KROK;
    if(P.ruch.t >= 1){ zakonczKrok(); }
    else {
      P.px = (P.ruch.x0 + (P.ruch.x1-P.ruch.x0)*P.ruch.t) * T;
      P.py = (P.ruch.y0 + (P.ruch.y1-P.ruch.y0)*P.ruch.t) * T;
    }
  }
  if(!P.ruch && !panelOtwarty){
    if(klawisze.l || klawisze.p || klawisze.g || klawisze.d){
      kolejka = [];
      if(klawisze.l) sprobujKrok(-1,0);
      else if(klawisze.p) sprobujKrok(1,0);
      else if(klawisze.g) sprobujKrok(0,-1);
      else if(klawisze.d) sprobujKrok(0,1);
    } else if(kolejka.length){
      const n = kolejka.shift();
      if(!sprobujKrok(n.x-P.x, n.y-P.y)) kolejka = [];
    }
  }
  ruszajZwierzeta(dt);
  ustawKamere(false);
  if(M.komunikat){ M.komunikat.t -= dt/60; if(M.komunikat.t <= 0) M.komunikat = null; }
  if(lornetkaCzas > 0){
    lornetkaCzas -= dt/60;
    if(lornetkaCzas <= 0){ lornetkaCzas = 0; rysujPlecak(); }
    else odsloniec(true);
  }

  if(++licznikHud >= 12){ licznikHud = 0; rysujTropy(); aktualizujInfo(); if(!M.zoo) rysujPlecak(); }
  if(brudna && postep.kroki % 25 === 0){ zapiszMgle(); zapisz(); }
}

/* =========================================================
   RYSOWANIE
   ========================================================= */
function rysujGracza(){
  const sx = P.px - kam.x + T/2, sy = P.py - kam.y + T/2;
  const bob = P.ruch ? Math.abs(Math.sin(P.ruch.t*Math.PI*2))*3 : 0;
  ctx.save();
  ctx.globalAlpha = .3; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(sx, sy+16, 13, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.translate(sx, sy - bob); ctx.scale(P.kier, 1);
  // plecak
  ctx.fillStyle = '#8a5a34';
  zaokrRect(-14, -6, 10, 15, 3);
  // nogi
  const rozkrok = P.ruch ? Math.sin(P.ruch.t*Math.PI*2)*4 : 0;
  ctx.fillStyle = '#3f5a72';
  zaokrRect(-6+rozkrok, 7, 5, 10, 2);
  zaokrRect(1-rozkrok, 7, 5, 10, 2);
  // tułów
  ctx.fillStyle = '#7f9a5a';
  zaokrRect(-8, -7, 16, 16, 5);
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  zaokrRect(-2, -7, 4, 16, 2);
  // ręka
  ctx.fillStyle = '#6f8a4c';
  zaokrRect(4, -4, 7, 5, 2);
  // głowa
  ctx.fillStyle = '#f0c49a';
  ctx.beginPath(); ctx.arc(1, -14, 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2a2320';
  ctx.beginPath(); ctx.arc(5, -15, 1.6, 0, Math.PI*2); ctx.fill();
  // kapelusz podróżnika
  ctx.fillStyle = '#8a6a3a';
  ctx.beginPath(); ctx.ellipse(1, -20, 14, 4, 0, 0, Math.PI*2); ctx.fill();
  zaokrRect(-6, -28, 13, 9, 4);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.fillRect(-6, -22, 13, 3);
  ctx.restore();
}

function sasiadujeZMgla(x,y){
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx, ny=y+dy;
    if(nx<0||ny<0||nx>=MW||ny>=MH) return true;
    if(!M.mgla[ny*MW+nx]) return true;
  }
  return false;
}

function rysujMinimape(){
  const s = 3, mw = MW*s, mh = MH*s, ox = W-mw-16, oy = 16;
  ctx.fillStyle = 'rgba(6,18,12,.78)';
  zaokrRect(ox-7, oy-7, mw+14, mh+14, 10);
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    if(!M.mgla[y*MW+x]) continue;
    const k = M.kafle[y*MW+x];
    ctx.fillStyle = k===WODA ? '#31708f' : k===PRZESZKODA ? '#2f4a35'
      : k===PLOT ? '#a3763f' : k===WYBIEG ? '#9ec47f' : k===SCIEZKA ? '#cdb387' : '#7aa462';
    ctx.fillRect(ox+x*s, oy+y*s, s, s);
  }
  for(const z of M.zwierzeta){
    if(!z.znalezione) continue;
    ctx.fillStyle = '#8ee06a';
    ctx.fillRect(ox+z.x*s-1, oy+z.y*s-1, s+2, s+2);
  }
  ctx.fillStyle = '#fff';
  ctx.fillRect(ox+P.x*s-1, oy+P.y*s-1, s+2, s+2);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
  ctx.strokeRect(ox + Math.round(kam.x/T)*s, oy + Math.round(kam.y/T)*s, (W/T)*s, (H/T)*s);
}

function rysuj(){
  const K = M.K;
  ctx.fillStyle = '#08150f'; ctx.fillRect(0,0,W,H);
  const x0 = Math.max(0, Math.floor(kam.x/T)), y0 = Math.max(0, Math.floor(kam.y/T));
  const x1 = Math.min(MW-1, x0 + Math.ceil(W/T)), y1 = Math.min(MH-1, y0 + Math.ceil(H/T));

  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++)
    rysujKafel(M.kafle[y*MW+x], x*T-kam.x, y*T-kam.y, x, y, K);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  if(M.zoo) rysujZooDodatki();
  else {
  // ślady
  for(const s of M.slady){
    if(!M.mgla[s.y*MW+s.x]) continue;
    const z = M.zwierzeta[s.zw];
    if(z && z.znalezione) continue;
    const sx = s.x*T - kam.x + T/2, sy = s.y*T - kam.y + T/2;
    if(sx < -T || sx > W+T || sy < -T || sy > H+T) continue;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(s.obrot);
    ctx.globalAlpha = .6; ctx.font = '23px "Segoe UI Emoji", sans-serif';
    ctx.fillText('🐾', 0, 0); ctx.restore();
  }
  ctx.globalAlpha = 1;

  // przedmioty do podniesienia
  for(const p of M.przedmioty){
    if(p.wziety || !M.mgla[p.y*MW+p.x]) continue;
    const sx = p.x*T - kam.x + T/2, sy = p.y*T - kam.y + T/2;
    if(sx < -T || sx > W+T || sy < -T || sy > H+T) continue;
    const bob = Math.sin(czas*3 + p.i)*3;
    ctx.globalAlpha = .40; ctx.fillStyle = '#fff3c4';
    ctx.beginPath(); ctx.arc(sx, sy+bob, 16 + Math.sin(czas*4+p.i)*1.5, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = '27px "Segoe UI Emoji", sans-serif';
    ctx.fillText(PRZEDMIOTY[p.typ].em, sx, sy + bob);
  }

  // zwierzęta — widoczne z bliska albo już odkryte
  for(const z of M.zwierzeta){
    const dx = z.x-P.x, dy = z.y-P.y;
    const blisko = Math.sqrt(dx*dx+dy*dy) <= zasieg() + 0.6;
    if(!blisko && !(z.znalezione && M.mgla[z.y*MW+z.x])) continue;
    const sx = z.x*T - kam.x + T/2, sy = z.y*T - kam.y + T/2;
    if(sx < -T || sx > W+T || sy < -T || sy > H+T) continue;
    const bob = Math.sin(czas*2.4 + z.i)*3;
    if(!z.znalezione && M.trud && M.trud.poswiata){   // podpowiedź tylko w łatwiejszych krainach
      ctx.globalAlpha = .5; ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.arc(sx, sy+bob, 22 + Math.sin(czas*4)*2, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.font = '34px "Segoe UI Emoji", sans-serif';
    if(z.f) ctx.filter = z.f;
    ctx.fillText(z.em, sx, sy + bob);
    ctx.filter = 'none';
  }

  }

  rysujGracza();

  if(M.K.noc){          // jaskinie, głębiny i mapy nocne są ciemniejsze
    ctx.fillStyle = 'rgba(8,16,34,.34)';
    ctx.fillRect(0,0,W,H);
  }

  if(!M.zoo){
  // mgła wojny
  ctx.fillStyle = '#08150f';
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    if(M.mgla[y*MW+x]) continue;
    ctx.fillRect(x*T-kam.x, y*T-kam.y, T, T);
  }
  ctx.fillStyle = 'rgba(8,21,15,.34)';
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    if(!M.mgla[y*MW+x] || !sasiadujeZMgla(x,y)) continue;
    ctx.fillRect(x*T-kam.x, y*T-kam.y, T, T);
  }

  }

  rysujMinimape();

  // komunikat na górze ekranu
  if(M.komunikat){
    const a = clamp(M.komunikat.t, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = 'bold 19px "Segoe UI", sans-serif';
    const szer = ctx.measureText(M.komunikat.txt).width + 40;
    ctx.fillStyle = 'rgba(10,26,18,.9)';
    zaokrRect(W/2 - szer/2, 18, szer, 42, 14);
    ctx.fillStyle = '#ffd166';
    ctx.fillText(M.komunikat.txt, W/2, 40);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function petla(ts){
  animId = requestAnimationFrame(petla);
  if(!M) return;
  if(!ostatni) ostatni = ts;
  let dt = (ts - ostatni)/16.6667; ostatni = ts;
  dt = clamp(dt, 0, 3);
  czas += dt/60;
  if(!panelOtwarty && wGrze()) aktualizuj(dt);
  rysuj();
}

/* =========================================================
   PASEK TROPIENIA I INFO
   ========================================================= */
function strzalka(dx, dy){
  const a = Math.atan2(dy, dx);
  const i = ((Math.round(a/(Math.PI/4)) % 8) + 8) % 8;
  return ['→','↘','↓','↙','←','↖','↑','↗'][i];
}

function rysujTropy(){
  if(!M) return;
  const ov = document.getElementById('tropyDotyk');
  if(M.zoo){
    if(ov) ov.innerHTML = '';
    const ile = Object.keys(postep.zoo).length, mozliwe = ileWybiegow();
    document.getElementById('tropy').innerHTML =
      '<div class="trop znaleziony" style="grid-column:1/-1"><div class="em">🏛️</div>' +
      '<div class="txt"><div class="nz">Twoje ZOO — ' + ile + ' z ' + mozliwe + ' wybiegów zajętych</div>' +
      '<div class="st">Kliknij wybieg albo stań przy tabliczce i naciśnij E, żeby wybrać mieszkańca.</div>' +
      '</div></div>';
    return;
  }
  document.getElementById('tropy').innerHTML = M.zwierzeta.map(z => {
    if(z.znalezione)
      return '<div class="trop znaleziony"><div class="em">' + emo(z) + '</div>' +
             '<div class="txt"><div class="nz">' + z.nazwa + '</div>' +
             '<div class="st">odkryte ✓</div></div></div>';
    if(z.tropione){
      const dx = z.x-P.x, dy = z.y-P.y, d = Math.abs(dx)+Math.abs(dy);
      const opis = d <= 3 ? 'tuż obok!' : d <= 8 ? 'blisko' : d <= 16 ? 'niedaleko' : 'daleko';
      return '<div class="trop tropiony"><div class="em">🐾</div>' +
             '<div class="txt"><div class="nz">Tajemniczy trop</div>' +
             '<div class="st">' + opis + '</div></div>' +
             '<div class="strzalka">' + strzalka(dx,dy) + '</div></div>';
    }
    return '<div class="trop"><div class="em">❓</div>' +
           '<div class="txt"><div class="nz">Nieznane zwierzę</div>' +
           '<div class="st">szukaj tropów 🐾</div></div></div>';
  }).join('');

  // ta sama informacja w wersji na mapę (tablet / pełny ekran)
  if(!ov) return;
  ov.innerHTML = M.zwierzeta.map(z => {
    if(z.znalezione)
      return '<div class="chip ok"><span class="e">' + emo(z) + '</span>✓</div>';
    if(z.tropione){
      const dx = z.x-P.x, dy = z.y-P.y, d = Math.abs(dx)+Math.abs(dy);
      const opis = d <= 3 ? 'tuż obok' : d <= 8 ? 'blisko' : d <= 16 ? 'niedaleko' : 'daleko';
      return '<div class="chip trop"><span class="e">🐾</span>' + strzalka(dx,dy) +
             '<span class="s">' + opis + '</span></div>';
    }
    return '<div class="chip"><span class="e">❓</span></div>';
  }).join('');
}

function aktualizujInfo(){
  if(!M) return;
  if(M.zoo){
    document.getElementById('infoMapy').textContent =
      'Wybiegi: ' + ileWybiegow() + ' z ' + PROG_WYBIEGU.length + ' zbudowanych  •  mieszkańcy: ' +
      Object.keys(postep.zoo).length + '  •  w albumie: ' + razemZnalezionych() + ' zwierząt';
    return;
  }
  const ile = M.zwierzeta.filter(z => z.znalezione).length;
  document.getElementById('infoMapy').textContent =
    'Zwierzęta: ' + ile + '/' + ILE_ZWIERZAT + '  •  mapa odkryta w ' + procentOdkryty() + '%' +
    '  •  trudność ' + M.trud.poziom + '/5  •  zasięg wzroku ' + M.trud.zasieg.toFixed(1) +
    '  •  kroki: ' + postep.kroki;
}

/* =========================================================
   EKWIPUNEK TROPICIELA
   ========================================================= */
function kierunekSlownie(dx, dy){
  const a = Math.atan2(dy, dx);
  const i = ((Math.round(a/(Math.PI/4)) % 8) + 8) % 8;
  return ['wschodzie','południowym wschodzie','południu','południowym zachodzie',
          'zachodzie','północnym zachodzie','północy','północnym wschodzie'][i];
}

function najblizsze(warunek){
  return M.zwierzeta
    .filter(z => !z.znalezione && warunek(z))
    .sort((a,b) => (Math.abs(a.x-P.x)+Math.abs(a.y-P.y)) - (Math.abs(b.x-P.x)+Math.abs(b.y-P.y)))[0];
}

function uzyj(typ){
  if(!M || M.zoo || panelOtwarty || !P) return;
  if(!(postep.plecak[typ] > 0)) return;
  let zuzyte = true;

  if(typ === 'lornetka'){
    lornetkaCzas = 25;
    odsloniec(true);
    M.komunikat = {txt:'🔭  Patrzysz przez lornetkę — widzisz dużo dalej!', t:2.8};

  } else if(typ === 'mapa'){
    for(let dy=-9;dy<=9;dy++) for(let dx=-9;dx<=9;dx++){
      if(dx*dx + dy*dy > 81) continue;
      const x = P.x+dx, y = P.y+dy;
      if(x<0||y<0||x>=MW||y>=MH) continue;
      M.mgla[y*MW+x] = 1;
    }
    brudna = true;
    odsloniec(false);
    zapiszMgle(); zapisz();
    M.komunikat = {txt:'🗺️  Rozkładasz mapę — okolica odsłonięta.', t:2.8};

  } else if(typ === 'kompas'){
    const cel = najblizsze(z => !z.tropione);
    if(!cel){
      M.komunikat = {txt:'🧭  Igła stoi spokojnie — tropisz już wszystkie zwierzęta.', t:3};
      zuzyte = false;
    } else {
      cel.tropione = true; sfx.trop();
      M.komunikat = {txt:'🧭  Igła drgnęła! Coś jest na ' + kierunekSlownie(cel.x-P.x, cel.y-P.y) + '.', t:3.2};
    }

  } else if(typ === 'karma'){
    const cel = najblizsze(z => Math.abs(z.x-P.x) + Math.abs(z.y-P.y) <= 16);
    if(!cel){
      M.komunikat = {txt:'🍎  Zostawiasz karmę, ale w pobliżu nikogo nie ma…', t:3};
      zuzyte = false;
    } else {
      cel.wabik = {x:P.x, y:P.y, t:900};
      cel.tropione = true; cel.ruch = 0;
      M.komunikat = {txt:'🍎  Karma leży na ziemi… coś się zbliża!', t:3.2};
    }
  }

  if(zuzyte){ postep.plecak[typ]--; zapisz(); }
  if(M.komunikat) mow(M.komunikat.txt);
  rysujPlecak(); rysujTropy();
}

function rysujPlecak(){
  const box = document.getElementById('plecak');

  box.innerHTML = TYPY_PRZEDMIOTOW.map((t,i) => {
    const ile = postep.plecak[t] || 0;
    const dziala = (t === 'lornetka' && lornetkaCzas > 0);

      ' data-typ="' + t + '"' + (ile ? '' : ' disabled') + '>' +

        (dziala ? 'działa jeszcze ' + Math.ceil(lornetkaCzas) + ' s' : PRZEDMIOTY[t].opis) +

    return '<button class="rzeczD' + (ile ? '' : ' pusta') + (dziala ? ' dziala' : '') + '"' +
      ' data-typ="' + t + '"' + (ile ? '' : ' disabled') +

/* =========================================================
   MOJE ZOO
   ========================================================= */
const ZOO_K = {
  id:'zoo', nazwa:'Moje ZOO',
  trawa:['#77a85c','#6d9e53'], krzak:'#4f7a3c', drzewo:'#3d6b34', pien:'#5a3f27',
  woda:'#3f8fb0', skala:'#8a9080', rodzaj:'swierk', zwierzeta:[]
};
/* ile zwierząt trzeba mieć w albumie, żeby otworzyć kolejny wybieg */
const PROG_WYBIEGU = [0, 0, 0, 2, 4, 7, 10, 14, 18, 23, 28, 34];

function ileWybiegow(){
  const zn = razemZnalezionych();
  let ile = 0;
  for(const prog of PROG_WYBIEGU) if(zn >= prog) ile++;
  return ile;
}

function zwierzeWSlocie(slot){
  const w = postep.zoo[slot];
  if(!w) return null;
  const K = KRAINY[w.k];
  if(!K || !K.zwierzeta[w.i]) return null;
  return Object.assign({}, K.zwierzeta[w.i], {kraina:K.nazwa});
}

function budujZoo(){
  const kafle = new Uint8Array(MW*MH);
  for(let i=0;i<kafle.length;i++) kafle[i] = TRAWA;
  for(let x=0;x<MW;x++){ kafle[x] = PRZESZKODA; kafle[(MH-1)*MW+x] = PRZESZKODA; }
  for(let y=0;y<MH;y++){ kafle[y*MW] = PRZESZKODA; kafle[y*MW+MW-1] = PRZESZKODA; }

  // 12 wybiegów 6x5 w siatce 4 x 3
  const wybiegi = [];
  for(let r=0;r<3;r++) for(let c=0;c<4;c++){
    const x0 = 3 + c*9, y0 = 3 + r*8;
    for(let y=y0;y<y0+5;y++) for(let x=x0;x<x0+6;x++){
      const brzeg = (x===x0 || x===x0+5 || y===y0 || y===y0+4);
      kafle[y*MW+x] = brzeg ? PLOT : WYBIEG;
    }
    wybiegi.push({slot:r*4+c, x0, y0, w:6, h:5, tabX:x0+3, tabY:y0+5});
  }

  // alejki
  const alejka = (x,y) => {
    if(x>0 && y>0 && x<MW-1 && y<MH-1 && kafle[y*MW+x] === TRAWA) kafle[y*MW+x] = SCIEZKA;
  };
  const kolumny = [2, 9,10, 18,19, 27,28, 36,37];
  const wiersze = [2, 8,9, 16,17, 24,25];
  for(let y=1;y<MH-1;y++) for(const x of kolumny) alejka(x,y);
  for(let x=1;x<MW-1;x++) for(const y of wiersze) alejka(x,y);

  // zieleń dekoracyjna na resztkach trawy
  for(let y=1;y<MH-1;y++) for(let x=1;x<MW-1;x++){
    if(kafle[y*MW+x] !== TRAWA) continue;
    const h = hash2(x*3+1, y*7+5);
    if(h > 0.90) kafle[y*MW+x] = PRZESZKODA;
    else if(h > 0.78) kafle[y*MW+x] = KRZAK;
  }
  return {kafle, wybiegi};
}

function startZoo(){
  const {kafle, wybiegi} = budujZoo();
  const mgla = new Uint8Array(MW*MH);
  for(let i=0;i<mgla.length;i++) mgla[i] = 1;          // w zoo widać wszystko
  M = {zoo:true, idx:-1, K:ZOO_K, kafle, wybiegi, mgla,
       zwierzeta:[], slady:[], przedmioty:[], komunikat:null, celWybieg:null, podpowiedz:null};
  P = {x:19, y:25, px:19*T, py:25*T, kier:1, ruch:null};
  kolejka = [];
  panelOtwarty = false;
  schowajPanel();
  ustawKamere(true);
  sprawdzTabliczke();
  document.getElementById('tytulMapy').textContent = '🏛️ Moje ZOO';
  document.getElementById('plecak').style.display = 'none';
  document.getElementById('plecakDotyk').style.display = 'none';
  ekran('ekranGry');
  rysujTropy(); aktualizujInfo();
  sfx.mapa();
  ostatni = 0;
  if(!animId) animId = requestAnimationFrame(petla);
}

/* czy stoimy przed tabliczką któregoś wybiegu */
function sprawdzTabliczke(){
  M.podpowiedz = null;
  for(const w of M.wybiegi){
    if(P.x === w.tabX && P.y === w.tabY){
      M.podpowiedz = w.slot;
      if(M.celWybieg === w.slot || dotyk){ M.celWybieg = null; otworzWybieg(w.slot); }
      return;
    }
  }
}

function rysujZooDodatki(){
  const otwartych = ileWybiegow();
  for(const w of M.wybiegi){
    const cx = (w.x0 + w.w/2)*T - kam.x, cy = (w.y0 + w.h/2)*T - kam.y;
    if(cx < -220 || cx > W+220) continue;
    const otwarty = w.slot < otwartych;

    if(!otwarty){
      ctx.globalAlpha = .85;
      ctx.font = '34px "Segoe UI Emoji", sans-serif';
      ctx.fillText('🚧', cx, cy - 6);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.font = 'bold 12px "Segoe UI", sans-serif';
      ctx.fillText('w budowie', cx, cy + 22);
    } else {
      const z = zwierzeWSlocie(w.slot);
      if(z){
        ctx.font = '42px "Segoe UI Emoji", sans-serif';
        if(z.f) ctx.filter = z.f;
        ctx.fillText(z.em, cx, cy + Math.sin(czas*2 + w.slot)*3);
        ctx.filter = 'none';
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.font = 'bold 12px "Segoe UI", sans-serif';
        ctx.fillText(z.nazwa, cx, cy + 32);
      } else {
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.font = 'bold 13px "Segoe UI", sans-serif';
        ctx.fillText('wolny wybieg', cx, cy);
      }
    }

    // tabliczka przy alejce
    const tx = w.tabX*T - kam.x + T/2, ty = w.tabY*T - kam.y + T/2;
    ctx.fillStyle = '#7a5a30';
    ctx.fillRect(tx-2, ty-4, 4, 14);
    ctx.fillStyle = otwarty ? '#e0b76a' : '#8f8f8f';
    zaokrRect(tx-17, ty-18, 34, 17, 5);
    ctx.fillStyle = '#3a2a12';
    ctx.font = 'bold 12px "Segoe UI", sans-serif';
    ctx.fillText(otwarty ? ('nr ' + (w.slot+1)) : '🔒', tx, ty-9);
  }

  if(M.podpowiedz != null){
    const txt = (dotyk ? 'Dotknij wybiegu nr ' : 'Naciśnij  E  —  wybieg nr ') + (M.podpowiedz+1);
    ctx.font = 'bold 18px "Segoe UI", sans-serif';
    const szer = ctx.measureText(txt).width + 44;
    ctx.fillStyle = 'rgba(10,26,18,.92)';
    zaokrRect(W/2 - szer/2, H-74, szer, 44, 14);
    ctx.fillStyle = '#ffd166';
    ctx.fillText(txt, W/2, H-51);
  }
}

function otworzWybieg(slot){
  if(slot >= ileWybiegow()){
    const brakuje = PROG_WYBIEGU[slot] - razemZnalezionych();
    M.komunikat = {txt:'🚧  Ten wybieg jest w budowie — wytrop jeszcze ' + brakuje + ' zwierząt.', t:3.4};
    mow('Ten wybieg jest jeszcze w budowie. Wytrop jeszcze ' + brakuje + ' ' +
        odmiana(brakuje,'zwierzę','zwierzęta','zwierząt') + '.');
    sfx.blok();
    return;
  }
  panelOtwarty = true;
  naklad.classList.remove('ukryj');

  const obecne = zwierzeWSlocie(slot);
  const wszystkie = [];
  KRAINY.forEach((K, ki) => znalezioneW(K.id).forEach(zi => wszystkie.push({ki, zi, z:K.zwierzeta[zi]})));
  const gdzieMieszka = {};
  Object.keys(postep.zoo).forEach(sl => {
    const w = postep.zoo[sl];
    if(w) gdzieMieszka[w.k + '_' + w.i] = +sl;
  });

  panelEl.innerHTML =
    '<h2>🏛️ Wybieg nr ' + (slot+1) + '</h2>' +
    (obecne ? '<p>Mieszka tu: <b>' + obecne.em + ' ' + obecne.nazwa + '</b></p>'
            : '<p>Wybieg jest pusty. Wybierz mieszkańca ze swojego albumu.</p>') +
    (wszystkie.length
      ? '<div class="wyborZw">' + wszystkie.map(a => {
          const gdzie = gdzieMieszka[a.ki + '_' + a.zi];
          const tutaj = gdzie === slot;
          return '<button class="zwBtn' + (tutaj ? ' tu' : (gdzie != null ? ' zajete' : '')) + '"' +
            ' data-k="' + a.ki + '" data-i="' + a.zi + '">' +
            '<span class="em">' + emo(a.z) + '</span>' +
            '<span class="nz">' + a.z.nazwa + '</span>' +
            (gdzie != null ? '<span class="gdzie">' + (tutaj ? 'tutaj' : 'wybieg ' + (gdzie+1)) + '</span>' : '') +
          '</button>';
        }).join('') + '</div>'
      : '<p>Twój album jest jeszcze pusty — wytrop pierwsze zwierzę i wróć tutaj!</p>') +
    '<div class="rzad">' +
    (obecne ? '<button class="cichy" id="zOproznij">Zabierz zwierzę</button>' : '') +
    '<button class="drugi" id="zZamknij">Zamknij</button></div>';

  [...panelEl.querySelectorAll('.zwBtn')].forEach(b => {
    b.onclick = () => {
      const k = +b.dataset.k, i = +b.dataset.i;
      // jedno zwierzę może mieszkać tylko w jednym wybiegu
      Object.keys(postep.zoo).forEach(sl => {
        const w = postep.zoo[sl];
        if(w && w.k === k && w.i === i) delete postep.zoo[sl];
      });
      postep.zoo[slot] = {k, i};
      zapisz(); sfx.odkrycie();
      const z = KRAINY[k].zwierzeta[i];
      schowajPanel();
      M.komunikat = {txt:'🏛️  ' + z.em + '  ' + z.nazwa + ' wprowadza się na wybieg nr ' + (slot+1) + '!', t:3.4};
      mow(z.nazwa + ' wprowadza się na wybieg numer ' + (slot+1) + '.');
      rysujTropy(); aktualizujInfo();
    };
  });
  const b = id => document.getElementById(id);
  if(b('zOproznij')) b('zOproznij').onclick = () => {
    delete postep.zoo[slot]; zapisz(); schowajPanel();
    rysujTropy(); aktualizujInfo();
  };
  b('zZamknij').onclick = () => schowajPanel();
}

/* =========================================================
   STEROWANIE
   ========================================================= */
const wGrze = () => document.getElementById('ekranGry').classList.contains('on');

/* ---------- TABLET / DOTYK ---------- */
const mm = q => !!(window.matchMedia && window.matchMedia(q).matches);
/* tablet = główny wskaźnik jest „gruby" (palec) i nie ma podłączonej myszy */
const dotykAuto = (mm('(pointer: coarse)') && !mm('(any-pointer: fine)')) ||
                  (!window.matchMedia && 'ontouchstart' in window);
let dotyk = dotykAuto;

/* gracz może wymusić swój tryb — ten sam plik obsługuje komputer i tablet */
function ustawSterowanie(){
  dotyk = (postep.sterowanie === 'dotyk') ? true
        : (postep.sterowanie === 'klawiatura') ? false
        : dotykAuto;
  document.body.classList.toggle('dotyk', dotyk);
  const b = document.getElementById('btnDotyk');
  if(b) b.textContent = dotyk ? '👆 Sterowanie: dotyk' : '⌨️ Sterowanie: klawiatura';
  document.querySelectorAll('.pod').forEach(p => {
    p.innerHTML = dotyk
      ? 'Chodź krzyżakiem po prawej stronie mapy &nbsp;•&nbsp; ekwipunek dotknij po lewej ' +
        '&nbsp;•&nbsp; w ZOO podejdź do wybiegu, a sam się otworzy'
      : 'Chodź <kbd>strzałkami</kbd> lub <kbd>WSAD</kbd> &nbsp;•&nbsp; ekwipunek na klawiszach ' +
        '<kbd>1</kbd>–<kbd>4</kbd> &nbsp;•&nbsp; w ZOO <kbd>E</kbd> otwiera wybieg';
  });
}

/* krzyżak kierunkowy steruje tym samym mechanizmem co klawisze */
[...document.querySelectorAll('#dpad button')].forEach(b => {
  const k = b.dataset.kier;
  const wcisnij = e => { e.preventDefault(); klawisze[k] = true; };
  const pusc    = e => { e.preventDefault(); klawisze[k] = false; };
  b.addEventListener('pointerdown', wcisnij);
  b.addEventListener('pointerup', pusc);
  b.addEventListener('pointerleave', pusc);
  b.addEventListener('pointercancel', pusc);
});

/* pełny ekran — na tablecie chowa paski przeglądarki */
const btnPE = document.getElementById('btnPelnyEkran');
if(!document.documentElement.requestFullscreen) btnPE.style.display = 'none';
btnPE.onclick = () => {
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }catch(e){}
};

document.getElementById('btnDotyk').onclick = () => {
  postep.sterowanie = dotyk ? 'klawiatura' : 'dotyk';
  zapisz(); ustawSterowanie();
};

const MAPA_KLAWISZY = {
  ArrowLeft:'l', KeyA:'l', ArrowRight:'p', KeyD:'p',
  ArrowUp:'g', KeyW:'g', ArrowDown:'d', KeyS:'d'
};
window.addEventListener('keydown', e => {
  const k = MAPA_KLAWISZY[e.code];
  if(k && wGrze()){ e.preventDefault(); klawisze[k] = true; }
  if(e.code === 'Escape' && document.getElementById('ekranGry').classList.contains('on')){
    if(panelOtwarty) schowajPanel(); else wyjdzDoMap();
  }
  if(!M || panelOtwarty || !wGrze()) return;
  if(e.code === 'KeyE' && M.zoo && M.podpowiedz != null) otworzWybieg(M.podpowiedz);
  const nr = {Digit1:0, Digit2:1, Digit3:2, Digit4:3, Numpad1:0, Numpad2:1, Numpad3:2, Numpad4:3}[e.code];
  if(nr != null) uzyj(TYPY_PRZEDMIOTOW[nr]);
});
window.addEventListener('keyup', e => {
  const k = MAPA_KLAWISZY[e.code];
  if(k) klawisze[k] = false;
});
window.addEventListener('blur', () => { klawisze.l = klawisze.p = klawisze.g = klawisze.d = false; });

cv.addEventListener('pointerdown', e => {
  if(!M || panelOtwarty) return;
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (W / r.width) + kam.x;
  const my = (e.clientY - r.top)  * (H / r.height) + kam.y;
  const cx = Math.floor(mx/T), cy = Math.floor(my/T);
  if(cx<0||cy<0||cx>=MW||cy>=MH) return;

  if(M.zoo){    // kliknięcie w wybieg = idź do jego tabliczki i otwórz
    const w = M.wybiegi.find(w => cx >= w.x0 && cx < w.x0+w.w && cy >= w.y0 && cy < w.y0+w.h);
    if(w){
      if(P.x === w.tabX && P.y === w.tabY){ otworzWybieg(w.slot); return; }
      const dr = znajdzDroge(M.kafle, P.x, P.y, w.tabX, w.tabY);
      if(dr && dr.length){ kolejka = dr; M.celWybieg = w.slot; }
      return;
    }
  }
  // po mapie chodzi się wyłącznie strzałkami — dotknięcie terenu nic nie robi,
  // dzięki temu trzeba samemu wybierać drogę między drzewami i wodą
});

/* przyciski */
document.getElementById('btnDoKrain').onclick   = () => wyjdzDoMap();
document.getElementById('btnAlbum').onclick     = () => { rysujAlbum(); ekran('ekranAlbum'); };
document.getElementById('btnZoo').onclick       = () => startZoo();

/* lektor */
function odswiezLektor(){
  document.getElementById('btnLektor').textContent = lektorWl ? '🔊 Lektor: włączony' : '🔇 Lektor: wyłączony';
}
document.getElementById('btnLektor').onclick = () => {
  lektorWl = !lektorWl;
  postep.lektor = lektorWl;
  if(!lektorWl) cisza();
  else mow('Lektor włączony. Będę czytać ciekawostki o zwierzętach.');
  zapisz(); odswiezLektor();
};
document.getElementById('btnCzytajAlbum').onclick = () => {
  const teksty = [];
  KRAINY.forEach(K => {
    const zn = znalezioneW(K.id);
    if(!zn.length) return;
    teksty.push('Kraina: ' + K.nazwa + '.');
    zn.forEach(i => teksty.push(opisZwierza(K.zwierzeta[i])));
  });
  if(!teksty.length) mow('Album jest jeszcze pusty. Wytrop pierwsze zwierzę!');
  else mowWiele(teksty);
};
document.getElementById('btnStopLektor').onclick = () => cisza();
document.getElementById('wyborGlosu').onchange = (e) => {
  const g = listaGlosow().find(v => v.name === e.target.value);
  if(!g) return;
  glosPL = g; postep.glos = g.name; zapisz();
  mow('Cześć! Tak będę czytać ciekawostki o zwierzętach.');
};
document.getElementById('btnProbaGlosu').onclick = () =>
  mow('Żyrafa ma w szyi dokładnie tyle samo kręgów co ty. Siedem, tylko dużo dłuższych.');
document.getElementById('btnZooZAlbumu').onclick= () => startZoo();
document.getElementById('btnAlbumWroc').onclick = () => { rysujKrainy(); ekran('ekranKrainy'); };
document.getElementById('btnResetGry').onclick  = () => {
  if(confirm('Zacząć od nowa? Album, odkryte mapy i postęp zostaną wyczyszczone.')){
    postep = { odblok:1, znalezione:{}, mgla:{}, kroki:0,
               plecak:{lornetka:1, kompas:1, karma:1, mapa:1}, zebrane:{}, zoo:{} };
    zapisz(); rysujKrainy();
  }
};

/* start */
ustawSterowanie();
odswiezLektor();
odswiezListeGlosow();
szukajGlosu();
rysujKrainy();
